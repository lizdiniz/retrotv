[project]
name = "retrotv-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-workflows[mistralai]>=3.17.1",
    "pydantic>=2.14.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
